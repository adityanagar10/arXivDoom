name: ArxivScroll
options:
  bundleIdPrefix: com.dev.arxivscroll
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SUPPORTS_MACCATALYST: "YES"
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
targets:
  ArxivScroll:
    type: application
    platform: iOS
    sources:
      - path: ArxivScroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.arxivscroll
        SUPPORTS_MACCATALYST: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W2W2Q6DWTM
  ArxivScrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArxivScrollTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.arxivscroll.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: ArxivScroll
  ArxivScrollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ArxivScrollUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.arxivscroll.uitests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: ArxivScroll
schemes:
  ArxivScroll:
    build:
      targets:
        ArxivScroll: all
        ArxivScrollUITests: [test]
    test:
      targets:
        - ArxivScrollTests
        - ArxivScrollUITests
    run:
      config: Debug
